# Bloob's Dolby Vision helper: one C function around quietvoid's dolby_vision
# crate (dovi_tool's library, MIT). Built as a static library by
# scripts/build-dovi.sh into build-dovi/<target>/ and linked into the engine.
[package]
name = "bloob_dovi"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
dolby_vision = { version = "=3.4.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"
